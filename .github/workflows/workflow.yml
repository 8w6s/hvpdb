name: CI + Publish Python distribution

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test (smoke + build)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install build pytest ruff

      - name: Compile
        run: python -m compileall -q hvpdb

      - name: Smoke import
        run: python -c "import hvpdb; import hvpdb.cli; import hvpdb.hvpshell; print('smoke_ok')"

      - name: Lint
        run: ruff check --select E,F,I --ignore E501 hvpdb tests

      - name: Typecheck
        run: |
          python -m pip install pyright
          pyright

      - name: Test
        run: pytest -q

      - name: Build sdist/wheel
        run: python -m build

  build:
    name: Build distribution 
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build backend
        run: python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/hvpdb

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
